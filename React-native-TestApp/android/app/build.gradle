apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.reactnativetesapp"
    defaultConfig {
        applicationId "com.reactnativetesapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Local .aar from native SDK nightly build (2.36.0-preview) to test
    // Camera2VideoCapturer NPE fix. Remove once 2.36.0 is on Maven.
    implementation files("${rootProject.projectDir}/../node_modules/@vonage/client-sdk-video-react-native/android/libs/opentok-android-sdk-2.36.0.aar")

    // MultiDex support for apps with >64K methods
    implementation("androidx.multidex:multidex:2.0.1")

    // Detox for E2E testing - use '+' to always match the version installed by npm
    androidTestImplementation("com.wix:detox:+")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Task to start Metro bundler automatically (similar to Xcode behavior)
 */
task startMetro(type: Exec) {
    description = "Start Metro bundler if not already running"
    
    // Only run for debug builds
    onlyIf {
        project.gradle.startParameter.taskNames.any { 
            it.toLowerCase().contains("debug") && !it.toLowerCase().contains("release")
        }
    }
    
    workingDir rootProject.projectDir.parent
    
    // Function to find npx in common locations
    def findNpx = {
        def home = System.getProperty('user.home')
        def candidatePaths = [
            // Try to find npx via 'which' command (works if in PATH)
            "npx",
            // Common nvm locations
            "${home}/.nvm/versions/node/*/bin/npx",
            // Homebrew on Intel Mac
            "/usr/local/bin/npx",
            // Homebrew on Apple Silicon
            "/opt/homebrew/bin/npx",
            // System install
            "/usr/bin/npx"
        ]
        
        // First try using 'which' via shell
        try {
            def whichNpx = "which npx".execute()
            whichNpx.waitFor()
            if (whichNpx.exitValue() == 0) {
                def path = whichNpx.text.trim()
                if (path && new File(path).exists()) {
                    return path
                }
            }
        } catch (Exception ignored) {}
        
        // Try each candidate path
        for (pattern in candidatePaths) {
            if (pattern.contains('*')) {
                // Handle glob pattern for nvm
                def nvmDir = new File("${home}/.nvm/versions/node")
                if (nvmDir.exists()) {
                    def versions = nvmDir.listFiles()?.sort()?.reverse()
                    for (versionDir in versions ?: []) {
                        def npxFile = new File(versionDir, "bin/npx")
                        if (npxFile.exists()) {
                            return npxFile.absolutePath
                        }
                    }
                }
            } else {
                def file = new File(pattern)
                if (file.exists()) {
                    return file.absolutePath
                }
            }
        }
        
        return "npx" // Fallback to hoping it's in PATH
    }
    
    def npxExecutable = findNpx()
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'start', 'cmd', '/k', "${npxExecutable} react-native start"
    } else {
        // Use the start-metro.sh script which waits for Metro to be ready
        def startScript = new File(rootProject.projectDir.parent, "scripts/start-metro.sh")
        if (startScript.exists()) {
            commandLine 'bash', startScript.absolutePath
        } else {
            // Fallback: check if Metro is already running
            def checkMetro = "lsof -i :8081 -sTCP:LISTEN -t".execute()
            checkMetro.waitFor()
            
            if (checkMetro.exitValue() != 0) {
                // Metro not running, start it in a new shell that inherits user's environment
                commandLine 'sh', '-c', "${npxExecutable} react-native start > /dev/null 2>&1 &"
            } else {
                // Metro already running, skip
                commandLine 'echo', 'Metro bundler already running'
            }
        }
    }
    
    // Ignore exit code as the background process may cause non-zero exit
    ignoreExitValue true
}

/**
 * Task to set up ADB reverse port forwarding for Metro bundler
 */
task setupAdbReverse(type: Exec) {
    description = "Set up ADB reverse port forwarding for Metro (localhost:8081)"
    
    // Only run for debug builds
    onlyIf {
        project.gradle.startParameter.taskNames.any { 
            it.toLowerCase().contains("debug") && !it.toLowerCase().contains("release")
        }
    }
    
    // Check if adb is available and device is connected
    doFirst {
        try {
            def adbCheck = "adb devices".execute()
            adbCheck.waitFor()
            def output = adbCheck.text
            // Check if there's at least one device connected (lines after first line)
            def lines = output.split('\n')
            if (lines.length < 2 || !lines[1].trim()) {
                throw new GradleException("No Android devices connected. Skipping adb reverse.")
            }
        } catch (Exception e) {
            println "Warning: Could not check for connected devices: ${e.message}"
        }
    }
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'adb', 'reverse', 'tcp:8081', 'tcp:8081'
    } else {
        commandLine 'adb', 'reverse', 'tcp:8081', 'tcp:8081'
    }
    
    // Don't fail the build if adb reverse fails (e.g., emulator may handle it automatically)
    ignoreExitValue true
}

// Make debug tasks depend on startMetro
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('assemble') && task.name.contains('Debug')) {
        task.dependsOn startMetro
    }
    if (task.name == 'installDebug') {
        task.dependsOn startMetro, setupAdbReverse
        // Ensure adb reverse runs after metro starts
        setupAdbReverse.mustRunAfter startMetro
    }
}

// TODO: Disable AAR metadata check until compileSdkVersion is bumped to 37.
// com.vonage:client-sdk-video:2.35.1 requires compile SDK 37, but current AGP
// does not officially support it yet. Full API level 37 support will be handled
// as part of https://jira.vonage.com/browse/VIDCS-4943
tasks.whenTaskAdded { task ->
    if (task.name.contains("AarMetadata")) {
        task.enabled = false
    }
}
