name: iOS Swift language modes

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'OpentokReactNative.podspec'
      - 'React-native-TestApp/ios/Podfile'
      - 'scripts/ios-swift-language-mode-check.sh'
      - '.github/workflows/ci-ios-swift-language-modes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-swift-language-modes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-language-modes:
    name: Swift ${{ matrix.swift }} (Xcode ${{ matrix.xcode }})
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        xcode: [latest-stable]
        swift: ['5', '6']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: React-native-TestApp/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('React-native-TestApp/ios/Podfile.lock', 'React-native-TestApp/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install React-native-TestApp dependencies
        working-directory: React-native-TestApp
        run: npm install

      - name: Install CocoaPods dependencies
        working-directory: React-native-TestApp/ios
        run: pod install

      - name: Build SDK pod in Swift ${{ matrix.swift }} mode
        run: scripts/ios-swift-language-mode-check.sh ${{ matrix.swift }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift${{ matrix.swift }}-xcode-${{ matrix.xcode }}-build-log
          path: artifacts/swift-language-modes/
          if-no-files-found: ignore
