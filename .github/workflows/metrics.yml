name: Aggregit

on:
  schedule:
    - cron: "0 0 * * *"

# Least-privilege GITHUB_TOKEN. Aggregit only reads repo metadata (commits,
# issues, PRs); it never writes. Avoids the default (potentially write-all) token.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  recordMetrics:
    runs-on: ubuntu-latest
    steps:
    - uses: michaeljolley/aggregit@v1
      with:
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        project_id: ${{ secrets.project_id }}
        private_key: ${{ secrets.private_key }}
        client_email: ${{ secrets.client_email }}
        firebaseDbUrl: ${{ secrets.firebaseDbUrl }}
