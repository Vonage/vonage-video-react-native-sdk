name: Require exactly one AI label on pull requests

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  require-ai-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for exactly one required AI label and comment on failure
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = ['ai-generated', 'ai-assisted', 'ai-touched'];
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const matched = labels.filter(name => allowed.includes(name));
            const marker = '<!-- ai-label-check -->';
            const failureBody = `${marker}
            This pull request must include one of the following labels:
            - \`ai-generated\` if more than 80% of the code was generated by AI (e.g., Copilot, Kiro, etc.) through any method (copy-pasting, code generation, etc.).
            - \`ai-assisted\` if between 20% and 80% of the code was generated by AI tools, with significant human contribution.
            - \`ai-touched\` if 20% or less of the code involved AI assistance.
            Please remember that, even if you manually change a line but the reasoning comes from AI, it is still considered AI-generated. If you are unsure, please ask for clarification.
            Use your knowledge, creativity, and experience to solve problems. AI is a tool, not a replacement: you must evaluate the balance between looping engineering, vibe coding, and AI assistance. Don't get caught in the slot-machine based development.
            Current matching AI labels: ${matched.length ? matched.map(l => `\`${l}\``).join(', ') : 'none'}
            Current labels: ${labels.length ? labels.map(l => `\`${l}\``).join(', ') : 'none'}`;
            const successBody = `${marker}
            ✅ Exactly one required AI label is present: \`${matched[0]}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (matched.length !== 1) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: failureBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: failureBody,
                });
              }
              core.setFailed(
                matched.length === 0
                  ? `Pull request must include exactly one of these labels: ${allowed.join(', ')}. None found.`
                  : `Pull request must include exactly one of these labels: ${allowed.join(', ')}. Found multiple: ${matched.join(', ')}. Apply only one.`
              );
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: successBody,
              });
            }
            core.info(`Found exactly one valid label: ${matched[0]}`);
