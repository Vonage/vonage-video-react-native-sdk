name: Publish All

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: true
        type: boolean
        default: true

jobs:
  check-tokens:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    steps:
      - name: Check token validity and expiry
        env:
          NPM_TOKEN_VONAGE: ${{ secrets.NPM_TOKEN_VONAGE }}
          NPM_TOKEN_OPENTOK: ${{ secrets.NPM_TOKEN_OPENTOK }}
          NPM_TOKEN_VONAGE_GITHUB: ${{ secrets.NPM_TOKEN_VONAGE_GITHUB }}
          NPM_TOKEN_OPENTOK_GITHUB: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}
        run: |
          FAILED=0

          print_expiry() {
            local NAME="$1" EXPIRY="$2"
            local EXPIRY_TS NOW_TS DAYS_LEFT
            EXPIRY_TS=$(date -d "$EXPIRY" +%s 2>/dev/null) || { echo "::warning::$NAME expires on $EXPIRY"; return; }
            NOW_TS=$(date +%s)
            DAYS_LEFT=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
            echo "::warning::$NAME expires on $(date -u -d "@$EXPIRY_TS" '+%Y-%m-%d %H:%M:%S UTC') ($DAYS_LEFT days left)"
          }

          check_npmjs_token() {
            local NAME="$1" TOKEN="${!1}"
            echo "🔑 $NAME (registry.npmjs.org)"
            if [ -z "$TOKEN" ]; then
              echo "::error::$NAME is not set"
              FAILED=1
              return
            fi

            local USERNAME
            USERNAME=$(curl -sf -H "Authorization: Bearer $TOKEN" https://registry.npmjs.org/-/whoami | jq -r '.username // empty')
            if [ -z "$USERNAME" ]; then
              echo "::error::$NAME is invalid or expired"
              FAILED=1
              return
            fi
            echo "✅ Valid (user: $USERNAME)"

            local REDACTED="${TOKEN:0:8}...${TOKEN: -4}"
            local EXPIRY="" PAGE=0 RESPONSE
            while [ -z "$EXPIRY" ] && [ "$PAGE" -lt 10 ]; do
              RESPONSE=$(curl -sf -H "Authorization: Bearer $TOKEN" "https://registry.npmjs.org/-/npm/v1/tokens?page=$PAGE&perPage=100") || break
              [ "$(echo "$RESPONSE" | jq '.objects | length')" -gt 0 ] || break
              EXPIRY=$(echo "$RESPONSE" | jq -r --arg t "$REDACTED" '[.objects[] | select(.token == $t) | .expiry // empty] | first // empty')
              PAGE=$((PAGE + 1))
            done

            if [ -n "$EXPIRY" ]; then
              print_expiry "$NAME" "$EXPIRY"
            else
              echo "::warning::$NAME expiry unavailable (token cannot list account tokens, or has no expiry)"
            fi
          }

          check_github_token() {
            local NAME="$1" TOKEN="${!1}"
            echo "🔑 $NAME (npm.pkg.github.com)"
            if [ -z "$TOKEN" ]; then
              echo "::error::$NAME is not set"
              FAILED=1
              return
            fi

            local HEADERS STATUS
            HEADERS=$(mktemp)
            STATUS=$(curl -s -o /dev/null -D "$HEADERS" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
            if [ "$STATUS" != "200" ]; then
              echo "::error::$NAME is invalid or expired (HTTP $STATUS)"
              FAILED=1
              rm -f "$HEADERS"
              return
            fi

            local USERNAME SCOPES EXPIRY
            USERNAME=$(curl -sf -H "Authorization: Bearer $TOKEN" https://api.github.com/user | jq -r '.login // empty')
            SCOPES=$(grep -i '^x-oauth-scopes:' "$HEADERS" | cut -d' ' -f2- | tr -d '\r')
            EXPIRY=$(grep -i '^github-authentication-token-expiration:' "$HEADERS" | cut -d' ' -f2- | tr -d '\r')
            rm -f "$HEADERS"

            echo "✅ Valid (user: $USERNAME)"
            if [ -n "$SCOPES" ]; then
              echo "🔐 Scopes: $SCOPES"
              if ! echo "$SCOPES" | grep -q 'write:packages'; then
                echo "::warning::$NAME is missing the write:packages scope"
              fi
            fi
            if [ -n "$EXPIRY" ]; then
              print_expiry "$NAME" "$EXPIRY"
            else
              echo "::warning::$NAME has no expiration date"
            fi
          }

          check_npmjs_token NPM_TOKEN_VONAGE
          echo ""
          check_npmjs_token NPM_TOKEN_OPENTOK
          echo ""
          check_github_token NPM_TOKEN_VONAGE_GITHUB
          echo ""
          check_github_token NPM_TOKEN_OPENTOK_GITHUB

          exit $FAILED

  publish-opentok-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Apply opentok-react-native package configuration
        run: |
          # Update package.json
          jq '.name = "opentok-react-native" | .scripts["version:published"] = "npm show opentok-react-native version"' package.json > package.json.tmp
          mv package.json.tmp package.json
          # Rebuild lockfile to sync with package.json changes
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: |
          npm ci
          npm run prepare

      - name: Determine NPM tag
        id: npm-tag
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ $VERSION == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "📦 Publishing with tag: alpha"
          elif [[ $VERSION == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "📦 Publishing with tag: beta"
          else
            echo "tag=" >> $GITHUB_OUTPUT
            echo "📦 Publishing without explicit tag (npm default)"
          fi

      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(npm run version:local --silent)
          BRANCH_VERSION="${{ github.ref_name }}"

          if [ "$PACKAGE_VERSION" != "$BRANCH_VERSION" ]; then
            echo "❌ Error: Version mismatch!"
            echo "Package.json has version $PACKAGE_VERSION but branch name indicates $BRANCH_VERSION"
            exit 1
          fi

      - name: Build .npmrc file
        run: |
          export NPM_AUTH_TOKEN="${{ secrets.NPM_TOKEN_OPENTOK }}"
          export NPMRC="//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}"
          printf "${NPMRC}" > .npmrc

      - name: Check if version already published
        id: published
        run: |
          VERSION="${{ github.ref_name }}"
          PUBLISHED_VERSION=$(npm run version:published --silent 2>/dev/null || echo "")

          if [ "$PUBLISHED_VERSION" == "$VERSION" ]; then
            echo "⚠️  Warning: Version $VERSION is already published on NPM!"
            echo "Skipping opentok-react-native @ npmjs.com"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Dry run - Verify package
        if: inputs.dry_run == true && steps.published.outputs.skip != 'true'
        run: |
          echo "🔍 DRY RUN MODE - opentok-react-native @ npmjs.com"
          TAG="${{ steps.npm-tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "📦 Tag: $TAG"
            npm publish --dry-run --tag "$TAG"
          else
            echo "📦 No explicit tag (using npm default)"
            npm publish --dry-run
          fi

      - name: Publish to NPM
        if: inputs.dry_run == false && steps.published.outputs.skip != 'true'
        run: |
          TAG="${{ steps.npm-tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            npm publish --tag "$TAG"
          else
            npm publish
          fi

  publish-opentok-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Apply @opentok/opentok-react-native package configuration
        run: |
          # Update package.json
          jq '.name = "@opentok/opentok-react-native" | .scripts["version:published"] = "npm show @opentok/opentok-react-native version"' package.json > package.json.tmp
          mv package.json.tmp package.json
          # Rebuild lockfile to sync with package.json changes
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: |
          npm ci
          npm run prepare

      - name: Determine NPM tag
        id: npm-tag
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ $VERSION == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "📦 Publishing with tag: alpha"
          elif [[ $VERSION == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "📦 Publishing with tag: beta"
          else
            echo "tag=" >> $GITHUB_OUTPUT
            echo "📦 Publishing without explicit tag (npm default)"
          fi

      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(npm run version:local --silent)
          BRANCH_VERSION="${{ github.ref_name }}"

          if [ "$PACKAGE_VERSION" != "$BRANCH_VERSION" ]; then
            echo "❌ Error: Version mismatch!"
            echo "Package.json has version $PACKAGE_VERSION but branch name indicates $BRANCH_VERSION"
            exit 1
          fi

      - name: Build .npmrc file
        run: |
          export NPM_GITHUB_AUTH_TOKEN="${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}"
          export NPMRC="always-auth=true\nregistry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${NPM_GITHUB_AUTH_TOKEN}"
          printf "${NPMRC}" > .npmrc

      - name: Check if version already published
        id: published
        run: |
          VERSION="${{ github.ref_name }}"
          PUBLISHED_VERSION=$(npm run version:published --silent 2>/dev/null || echo "")

          if [ "$PUBLISHED_VERSION" == "$VERSION" ]; then
            echo "⚠️  Warning: Version $VERSION is already published!"
            echo "Skipping @opentok/opentok-react-native @ github.com"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Dry run - Verify package
        if: inputs.dry_run == true && steps.published.outputs.skip != 'true'
        run: |
          echo "🔍 DRY RUN MODE - @opentok/opentok-react-native @ github.com"
          TAG="${{ steps.npm-tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "📦 Tag: $TAG"
            npm publish --dry-run --tag "$TAG"
          else
            echo "📦 No explicit tag (using npm default)"
            npm publish --dry-run
          fi

      - name: Publish to GitHub Package Registry
        if: inputs.dry_run == false && steps.published.outputs.skip != 'true'
        run: |
          TAG="${{ steps.npm-tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            npm publish --tag "$TAG"
          else
            npm publish
          fi

      - name: Verify publication
        if: inputs.dry_run == false && steps.published.outputs.skip != 'true'
        run: |
          sleep 10
          npm view @opentok/opentok-react-native@${{ github.ref_name }} version

