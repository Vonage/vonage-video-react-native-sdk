  summary:
    runs-on: ubuntu-latest
    needs: [check-tokens, verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github, publish-opentok-npm, publish-opentok-github, publish-vonage-npm, publish-vonage-github]
    if: always()
    steps:
      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
          CHECK_TOKENS_RESULT: ${{ needs.check-tokens.result }}
          OPENTOK_NPM_VERIFY_RESULT: ${{ needs.verify-opentok-npm.result }}
          OPENTOK_NPM_VERIFY_SKIP: ${{ needs.verify-opentok-npm.outputs.skip }}
          OPENTOK_NPM_PUBLISH_RESULT: ${{ needs.publish-opentok-npm.result }}
          OPENTOK_NPM_PUBLISH_SKIP: ${{ needs.publish-opentok-npm.outputs.skip }}
          OPENTOK_GITHUB_VERIFY_RESULT: ${{ needs.verify-opentok-github.result }}
          OPENTOK_GITHUB_VERIFY_SKIP: ${{ needs.verify-opentok-github.outputs.skip }}
          OPENTOK_GITHUB_PUBLISH_RESULT: ${{ needs.publish-opentok-github.result }}
          OPENTOK_GITHUB_PUBLISH_SKIP: ${{ needs.publish-opentok-github.outputs.skip }}
          VONAGE_NPM_VERIFY_RESULT: ${{ needs.verify-vonage-npm.result }}
          VONAGE_NPM_VERIFY_SKIP: ${{ needs.verify-vonage-npm.outputs.skip }}
          VONAGE_NPM_PUBLISH_RESULT: ${{ needs.publish-vonage-npm.result }}
          VONAGE_NPM_PUBLISH_SKIP: ${{ needs.publish-vonage-npm.outputs.skip }}
          VONAGE_GITHUB_VERIFY_RESULT: ${{ needs.verify-vonage-github.result }}
          VONAGE_GITHUB_VERIFY_SKIP: ${{ needs.verify-vonage-github.outputs.skip }}
          VONAGE_GITHUB_PUBLISH_RESULT: ${{ needs.publish-vonage-github.result }}
          VONAGE_GITHUB_PUBLISH_SKIP: ${{ needs.publish-vonage-github.outputs.skip }}
        run: |
          target_status() {
            local VERIFY_RESULT="$1" VERIFY_SKIP="$2" PUBLISH_RESULT="$3" PUBLISH_SKIP="$4"
            if [ "$VERIFY_RESULT" != "success" ]; then
              echo "❌ Verification $VERIFY_RESULT"
            elif [ "$VERIFY_SKIP" == "true" ] || { [ "$PUBLISH_RESULT" == "success" ] && [ "$PUBLISH_SKIP" == "true" ]; }; then
              echo "⏭️ Skipped (already published)"
            elif [ "$PUBLISH_RESULT" == "success" ]; then
              echo "✅ Published"
            elif [ "$PUBLISH_RESULT" == "skipped" ]; then
              echo "⏸️ Not published (a verification job failed)"
            elif [ "$PUBLISH_RESULT" == "cancelled" ]; then
              echo "🚫 Cancelled"
            else
              echo "❌ Failed or not approved"
            fi
          }

          {
            echo "## Publish All Summary"
            echo ""
            echo "- **Version**: $VERSION"
            echo "- **Token check**: $CHECK_TOKENS_RESULT"
            echo ""
            echo "| Target | Status |"
            echo "|---|---|"
            echo "| opentok-react-native @ npmjs.com | $(target_status "$OPENTOK_NPM_VERIFY_RESULT" "$OPENTOK_NPM_VERIFY_SKIP" "$OPENTOK_NPM_PUBLISH_RESULT" "$OPENTOK_NPM_PUBLISH_SKIP") |"
            echo "| @opentok/opentok-react-native @ github.com | $(target_status "$OPENTOK_GITHUB_VERIFY_RESULT" "$OPENTOK_GITHUB_VERIFY_SKIP" "$OPENTOK_GITHUB_PUBLISH_RESULT" "$OPENTOK_GITHUB_PUBLISH_SKIP") |"
            echo "| @vonage/client-sdk-video-react-native @ npmjs.com | $(target_status "$VONAGE_NPM_VERIFY_RESULT" "$VONAGE_NPM_VERIFY_SKIP" "$VONAGE_NPM_PUBLISH_RESULT" "$VONAGE_NPM_PUBLISH_SKIP") |"
            echo "| @vonage/client-sdk-video-react-native @ github.com | $(target_status "$VONAGE_GITHUB_VERIFY_RESULT" "$VONAGE_GITHUB_VERIFY_SKIP" "$VONAGE_GITHUB_PUBLISH_RESULT" "$VONAGE_GITHUB_PUBLISH_SKIP") |"
          } >> "$GITHUB_STEP_SUMMARY"
