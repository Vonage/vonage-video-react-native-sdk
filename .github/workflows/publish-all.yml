  summary:
    runs-on: ubuntu-latest
    needs: [publish-opentok-npm, publish-opentok-github, publish-vonage-npm, publish-vonage-github]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Publish All Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Publication Targets" >> $GITHUB_STEP_SUMMARY
          echo "1. opentok-react-native @ npmjs.com" >> $GITHUB_STEP_SUMMARY
          echo "2. @opentok/opentok-react-native @ github.com" >> $GITHUB_STEP_SUMMARY
          echo "3. @vonage/client-sdk-video-react-native @ npmjs.com" >> $GITHUB_STEP_SUMMARY
          echo "4. @vonage/client-sdk-video-react-native @ github.com" >> $GITHUB_STEP_SUMMARY
