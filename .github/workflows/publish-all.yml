name: Publish All

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-opentok-npm:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify opentok-react-native @ npmjs.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: verify
          package-name: opentok-react-native
          registry-url: https://registry.npmjs.org/
          version: ${{ github.ref_name }}
          publish-token: ${{ secrets.NPM_TOKEN_OPENTOK }}

  verify-opentok-github:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify @opentok/opentok-react-native @ github.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: verify
          package-name: '@opentok/opentok-react-native'
          registry-url: https://npm.pkg.github.com/
          scope: '@opentok'
          version: ${{ github.ref_name }}
          publish-token: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}
          token: ${{ github.token }}

  verify-vonage-npm:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify @vonage/client-sdk-video-react-native @ npmjs.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: verify
          package-name: '@vonage/client-sdk-video-react-native'
          registry-url: https://registry.npmjs.org/
          version: ${{ github.ref_name }}
          publish-token: ${{ secrets.NPM_TOKEN_VONAGE }}

  verify-vonage-github:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify @vonage/client-sdk-video-react-native @ github.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: verify
          package-name: '@vonage/client-sdk-video-react-native'
          registry-url: https://npm.pkg.github.com/
          scope: '@vonage'
          version: ${{ github.ref_name }}
          publish-token: ${{ secrets.NPM_TOKEN_VONAGE_GITHUB }}
          token: ${{ github.token }}

  publish-opentok-npm:
    needs: [verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github]
    if: needs.verify-opentok-npm.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish opentok-react-native @ npmjs.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: publish
          package-name: opentok-react-native
          registry-url: https://registry.npmjs.org/
          version: ${{ github.ref_name }}
          token: ${{ secrets.NPM_TOKEN_OPENTOK }}

  publish-opentok-github:
    needs: [verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github]
    if: needs.verify-opentok-github.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish @opentok/opentok-react-native @ github.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: publish
          package-name: '@opentok/opentok-react-native'
          registry-url: https://npm.pkg.github.com/
          scope: '@opentok'
          version: ${{ github.ref_name }}
          token: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}
          verify-publication: 'true'

  publish-vonage-npm:
    needs: [verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github]
    if: needs.verify-vonage-npm.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish @vonage/client-sdk-video-react-native @ npmjs.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: publish
          package-name: '@vonage/client-sdk-video-react-native'
          registry-url: https://registry.npmjs.org/
          version: ${{ github.ref_name }}
          token: ${{ secrets.NPM_TOKEN_VONAGE }}

      - name: Create tag
        if: steps.package.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" \
            -f message="New v$VERSION tag created!" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$TAG_SHA" > /dev/null
          echo "🏷️ Created tag v$VERSION at $GITHUB_SHA"

  publish-vonage-github:
    needs: [verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github]
    if: needs.verify-vonage-github.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      skip: ${{ steps.package.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish @vonage/client-sdk-video-react-native @ github.com
        id: package
        uses: ./.github/actions/npm-package
        with:
          mode: publish
          package-name: '@vonage/client-sdk-video-react-native'
          registry-url: https://npm.pkg.github.com/
          scope: '@vonage'
          version: ${{ github.ref_name }}
          token: ${{ secrets.NPM_TOKEN_VONAGE_GITHUB }}
          verify-publication: 'true'

  summary:
    runs-on: ubuntu-latest
    needs: [verify-opentok-npm, verify-opentok-github, verify-vonage-npm, verify-vonage-github, publish-opentok-npm, publish-opentok-github, publish-vonage-npm, publish-vonage-github]
    if: always()
    steps:
      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
          OPENTOK_NPM_VERIFY_RESULT: ${{ needs.verify-opentok-npm.result }}
          OPENTOK_NPM_VERIFY_SKIP: ${{ needs.verify-opentok-npm.outputs.skip }}
          OPENTOK_NPM_PUBLISH_RESULT: ${{ needs.publish-opentok-npm.result }}
          OPENTOK_NPM_PUBLISH_SKIP: ${{ needs.publish-opentok-npm.outputs.skip }}
          OPENTOK_GITHUB_VERIFY_RESULT: ${{ needs.verify-opentok-github.result }}
          OPENTOK_GITHUB_VERIFY_SKIP: ${{ needs.verify-opentok-github.outputs.skip }}
          OPENTOK_GITHUB_PUBLISH_RESULT: ${{ needs.publish-opentok-github.result }}
          OPENTOK_GITHUB_PUBLISH_SKIP: ${{ needs.publish-opentok-github.outputs.skip }}
          VONAGE_NPM_VERIFY_RESULT: ${{ needs.verify-vonage-npm.result }}
          VONAGE_NPM_VERIFY_SKIP: ${{ needs.verify-vonage-npm.outputs.skip }}
          VONAGE_NPM_PUBLISH_RESULT: ${{ needs.publish-vonage-npm.result }}
          VONAGE_NPM_PUBLISH_SKIP: ${{ needs.publish-vonage-npm.outputs.skip }}
          VONAGE_GITHUB_VERIFY_RESULT: ${{ needs.verify-vonage-github.result }}
          VONAGE_GITHUB_VERIFY_SKIP: ${{ needs.verify-vonage-github.outputs.skip }}
          VONAGE_GITHUB_PUBLISH_RESULT: ${{ needs.publish-vonage-github.result }}
          VONAGE_GITHUB_PUBLISH_SKIP: ${{ needs.publish-vonage-github.outputs.skip }}
        run: |
          target_status() {
            local VERIFY_RESULT="$1" VERIFY_SKIP="$2" PUBLISH_RESULT="$3" PUBLISH_SKIP="$4"
            if [ "$VERIFY_RESULT" != "success" ]; then
              echo "❌ Verification $VERIFY_RESULT"
            elif [ "$VERIFY_SKIP" == "true" ] || { [ "$PUBLISH_RESULT" == "success" ] && [ "$PUBLISH_SKIP" == "true" ]; }; then
              echo "⏭️ Skipped (already published)"
            elif [ "$PUBLISH_RESULT" == "success" ]; then
              echo "✅ Published"
            elif [ "$PUBLISH_RESULT" == "skipped" ]; then
              echo "⏸️ Not published (a verification job failed)"
            elif [ "$PUBLISH_RESULT" == "cancelled" ]; then
              echo "🚫 Cancelled"
            else
              echo "❌ Failed or not approved"
            fi
          }

          {
            echo "## Publish All Summary"
            echo ""
            echo "- **Version**: $VERSION"
            echo ""
            echo "| Target | Status |"
            echo "|---|---|"
            echo "| opentok-react-native @ npmjs.com | $(target_status "$OPENTOK_NPM_VERIFY_RESULT" "$OPENTOK_NPM_VERIFY_SKIP" "$OPENTOK_NPM_PUBLISH_RESULT" "$OPENTOK_NPM_PUBLISH_SKIP") |"
            echo "| @opentok/opentok-react-native @ github.com | $(target_status "$OPENTOK_GITHUB_VERIFY_RESULT" "$OPENTOK_GITHUB_VERIFY_SKIP" "$OPENTOK_GITHUB_PUBLISH_RESULT" "$OPENTOK_GITHUB_PUBLISH_SKIP") |"
            echo "| @vonage/client-sdk-video-react-native @ npmjs.com | $(target_status "$VONAGE_NPM_VERIFY_RESULT" "$VONAGE_NPM_VERIFY_SKIP" "$VONAGE_NPM_PUBLISH_RESULT" "$VONAGE_NPM_PUBLISH_SKIP") |"
            echo "| @vonage/client-sdk-video-react-native @ github.com | $(target_status "$VONAGE_GITHUB_VERIFY_RESULT" "$VONAGE_GITHUB_VERIFY_SKIP" "$VONAGE_GITHUB_PUBLISH_RESULT" "$VONAGE_GITHUB_PUBLISH_SKIP") |"
          } >> "$GITHUB_STEP_SUMMARY"
