          fi

      - name: Create tag
        if: inputs.dry_run == false && steps.published.outputs.skip != 'true'
        uses: negz/create-tag@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v${{github.ref_name }}
          message: New v${{github.ref_name}} tag created!

